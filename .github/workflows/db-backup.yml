name: Backup do banco (diário, criptografado)

# Faz um dump completo do banco Supabase todo dia, criptografa com uma senha
# (BACKUP_PASSPHRASE) e guarda como artefato do GitHub. Como o arquivo é cifrado
# ANTES de ser salvo, fica seguro mesmo com o repositório público.
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    -> string de conexão do banco (Supabase: Settings → Database →
#                         Connection string → URI, modo "Session pooler"; inclua a senha)
#   BACKUP_PASSPHRASE  -> uma senha forte para cifrar/decifrar o backup (guarde bem!)
#
# Para RESTAURAR um backup baixado (no seu computador):
#   gpg --batch --passphrase "SUA_SENHA" -o backup.sql -d backup.sql.gpg
#   psql "STRING_DE_CONEXAO" -f backup.sql

on:
  schedule:
    - cron: '0 6 * * *'   # todo dia ~03:00 (horário de Brasília)
  workflow_dispatch: {}    # permite rodar manualmente na aba Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente do PostgreSQL 17
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Gerar dump do banco
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Segredo SUPABASE_DB_URL não configurado."; exit 1
          fi
          STAMP=$(date -u +'%Y-%m-%d')
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges --clean --if-exists \
            -f "backup-$STAMP.sql"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "Tamanho do dump:"; ls -lh "backup-$STAMP.sql"

      - name: Criptografar o backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Segredo BACKUP_PASSPHRASE não configurado."; exit 1
          fi
          gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            -o "backup-$STAMP.sql.gpg" "backup-$STAMP.sql"
          rm -f "backup-$STAMP.sql"   # nunca sobe o arquivo não criptografado

      - name: Guardar o backup criptografado (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: ${{ github.workspace }}/backup-${{ env.STAMP }}.sql.gpg
          retention-days: 30
